[workspace]
members = ["programs/silent_circle", "arcium_compute", "encrypted-ixs"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
arcium-anchor = "0.9.6"
arcium-client = { default-features = false, version = "=0.9.6" }
arcium-macros = "0.9.6"
arcis = "0.9.6"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
